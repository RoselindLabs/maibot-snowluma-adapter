name: Adapter contracts and source package
on:
  push:
    branches: [neko/main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    name: runtime (${{ matrix.case }})
    if: github.repository == 'RoselindLabs/maibot-snowluma-adapter'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - {case: linux-production, os: ubuntu-24.04, python: '3.14.4'}
          - {case: windows-minimum, os: windows-latest, python: '3.12'}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install actual SDK and test dependencies
        run: python -I -m pip install "maibot-plugin-sdk==2.20.0" "aiohttp==3.14.3" "pytest==9.0.3" "pytest-asyncio==1.3.0"
      - run: python -I -m pip check
      - name: Run tests
        run: python -I scripts/check.py
      - name: Verify source package
        run: python -I scripts/package.py
  ci-gate:
    if: always()
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - run: python -c "assert '${{ needs.tests.result }}' == 'success'"
  publish-gate:
    if: always() && github.ref == 'refs/heads/neko/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - run: python -c "assert '${{ needs.tests.result }}' == 'success'"
